name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: metrics-agent
  DOCKERHUB_USER: serge000

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Diagnostic temporaire
        run: echo "longueur du token = ${#T}"
        env:
          T: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image de production
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests unitaires (pytest)
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Test de l'image construite (/health)
        run: |
          docker run -d --name api-ci -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api-ci
          exit 1

      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Générer les tags (latest + sha)
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Préparer QEMU (images amd64 + arm64)
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: Push vers Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
