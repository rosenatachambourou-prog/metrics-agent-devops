name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: metrics-agent

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image de production
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests unitaires (pytest)
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Test de l'image construite (/health)
        run: |
          docker run -d --name api-ci -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          trap 'docker rm -f api-ci' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "Health check réussi"
              exit 0
            fi
            sleep 2
          done
          docker logs api-ci
          exit 1

      - name: Vérifier la présence des secrets Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Les secrets DOCKERHUB_USERNAME et DOCKERHUB_TOKEN doivent être configurés dans le dépôt GitHub (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Générer les tags (latest + sha)
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Préparer QEMU (images amd64 + arm64)
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: Push vers Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mettre à jour la description Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "Agent de métriques système et API FastAPI (multi-architecture)."
          readme-filepath: ./DOCKERHUB.md
