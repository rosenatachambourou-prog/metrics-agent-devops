name: metrics-agent

services:
  api:
    image: ${DOCKERHUB_USERNAME:?definir DOCKERHUB_USERNAME dans .env}/metrics-agent:${IMAGE_TAG:-latest}
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - metrics-net
    restart: unless-stopped

  agent:
    image: ${DOCKERHUB_USERNAME:?definir DOCKERHUB_USERNAME dans .env}/metrics-agent:${IMAGE_TAG:-latest}
    build: .
    command: ["python", "-m", "app.agent"]
    env_file: .env
    hostname: metrics-agent-01
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - metrics-net
    restart: unless-stopped

networks:
  metrics-net:
    driver: bridge